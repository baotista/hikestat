[package]
name = "hikestat-app"
version = "2.1.0"
description = "Hikestat desktop app"
edition = "2024"

[lib]
# Distinct from the binary name (see https://github.com/rust-lang/cargo/issues/8519).
name = "hikestat_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hikestat = { git = "ssh://git@github.com/baotista/hikestats-ingester.git", tag = "v0.12.0" }
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["jiff"] }
specta-typescript = "0.0.12"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
